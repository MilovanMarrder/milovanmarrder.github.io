<!DOCTYPE html>
<html lang="es">
  <head>
    <link rel="stylesheet" href="estilo.css" />
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de firma</title>
    <script type="text/javascript" src="script.js"></script>
  </head>

  <body class="bodygenerador">
    <!-- En el siguiente div clase formulario tengo contenido el formulario // También necesario para posicionamiento en pagina -->
    <div>
      <form class="formulario">
        <h2 style="color: rgba(22, 17, 38, 0.9); text-align: center">
          DATOS PARA TU FIRMA
        </h2>
        <div>
          <div class="row">
            <div class="col">
              <!-- nombre del empleado // campo 1/6 -->
              <input
                type="text"
                id="nombre"
                placeholder="Ingresa el nombre a mostrar"
                onkeyup="V_nombre(this.value)"
              />
            </div>
          </div>
          <div class="row">
            <div class="col">
              <!-- Puesto del empleado // campo 2/6 -->
              <input
                type="text"
                id="puesto"
                placeholder="Puesto de trabajo"
                onkeyup="V_Puesto(this.value)"
              />
            </div>
          </div>
          <div class="row">
            <div class="col">
              <input
                type="text"
                id="Vista_tel"
                placeholder="Área o departamento"
                onkeyup="V_dept(this.value)"
              />

              <!-- Número de celular // campo 3/6 
              <input
                type="text"
                placeholder="Teléfono móvil (Opcional)"
                onkeyup="V_cel(this.value)"
              />-->
            </div>
          </div>
          <div class="row">
            <div class="row">
              <div class="col">
                <input
                  type="text"
                  id="mail"
                  placeholder="correo@hospitalmaria.com"
                  onkeyup="V_mail(this.value)"
                />
              </div>
            </div>
            <div class="col">
              <label for="v_ext"></label>
              <input
                type="text"
                id="V_ext"
                placeholder="Extensión"
                onkeyup="V_Ext(this.value)"
              />
            </div>
          </div>
        </div>
        <br />
        <div class="botones">
          <button
            type="reset"
            onclick="location.reload()"
            style="background-color: rgb(255, 255, 255, 0.3); color: #000"
          >
            Limpiar campos
          </button>
        </div>
      </form>
    </div>
    <!-- La siguiente linea es para anexar la firma generada configurada en JavaScript -->
    <div class="cajafirma">
      <div
        id="tablafirma"
        style="
          background-color: rgb(255, 255, 255);
          border-collapse: collapse;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        "
      >
        <table>
          <tbody>
            <tr>
              <!-- En el siguiente td está el logo -->
              <td>
                <a href="https://www.hospitalmaria.org/" target="_blank" style="text-decoration:none; color:#000;">
                  <img
                    class="logofirma"
                    alt="Hospital María Especialidades Pediátricas"
                   
                    src="icons\logo-hospital-maria-especialidades-pediatricas.jpg"
                                      
                    style="width: 80%;
                      height: 80%;
                      max-width: 300px;
                      max-height: 272;
                      min-width: 200px;
                      min-height: auto;
                    "
                    />
                </a>
                <p
                  style="
                    font-size: 10px;
                    text-align: center;
                    color: #f78c00;
                    font-weight: 900;
                  "
                >
                  <i>"Cambiamos la Vida de Nuestros Pacientitos"</i>
                </p>
              </td>
              <!-- Aquí termina el td del logo -->
              <!-- Estas td (Columna) conforman el separador vertical de color -->
              <td style="width: 13px"></td>
              <td
                style="
                  width: 1px;
                  background-image: linear-gradient(
                    to bottom,
                    rgba(247, 157, 0, 0.2),
                    rgba(247, 157, 0, 1),
                    rgba(247, 157, 0, 0.2)
                  );
                "
              ></td>
              <td style="width: 13px"></td>
              <!-- Hasta aquí el separador vertical (Verificar si se puede agregar sombra) -->
              <!-- Aqui inicia la tablita de el texto, -->
              <td>
                <table class="firma1texto">
                  <tbody>
                    <tr>
                      <td
                        style="font-size: 16px; color: #000; font-weight: bold"
                      >
                        <span id="Vista_nombre">Nombre del colaborador</span>
                      </td>
                    </tr>
                    <tr>
                      <td
                        style="
                          color: #4c4b4c;
                          font-weight: bold;
                          font-size: 11px;
                        "
                      >
                        <span id="Vista_puesto">Puesto de trabajo</span>
                      </td>
                    </tr>
                    <tr style="border-bottom: 3px solid black">
                      <td
                        style="
                          color: #4c4b4c;
                          font-weight: bold;
                          font-size: 11px;
                        "
                      >
                        <span id="Vista_departamento">Departamento</span>
                      </td>
                    </tr>
                    <tr>
                      <td style="height: 14px; color: #333333"></td>
                    </tr>
                    <tr>
                    <!--Se cambiaron las fuentes desde mi Drive al repositorio-->
                    </tr>
                    <tr>
                      <td style="color: #333333; min-width: 250px">
                        <a
                          style="
                            color: #333333;
                            text-decoration: none;
                            display: inline;
                          "
                          href="mailto:$mail"
                        >
                          <img
                            id="IconoSobre"
                            src="icons\iconomail.png"
                            alt="Email: "
                            style="width: 05%; height: 05%; max-width: 12px !important; max-height: 12px !important;"
                          />
                          <span id="Vista_mail">Correo@hospitalmaria.org</span>
                        </a>
                      </td>
                    </tr>
                    <tr>
                      <td>
                        <img
                          id="iconotel"
                          src="icons\iconotel.png"
                          alt="Tel: "
                          style="width: 05%; height: 05%; max-width: 12px !important; max-height: 12px !important;"
                        />
                        2236-0900

                        <span id="Vista_ext"></span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="16">
                <br />
                <img
                  id="IconoUbicacion"
                  src="icons\iconoubicacion.png"
                  alt="Ubicación: "
                  style="width: 02%; height: 02%; max-width: 10px !important; max-height: 10px !important;"
                />
                <span style="font-size: 12px"
                  >Anillo Periférico Contiguo a Residencial Suyapita,
                  Tegucigalpa, MDC.</span
                >
                <br />
                <div style="justify-content: space-between; width: 100%">
                  <img
                    id="IconoWWW"
                    src="icons\iconoweb.png"
                    alt="Sitio web: "
                    style="width: 02%; height: 02%; max-width: 10px !important; max-height: 10px !important;"
                  />
                  <span style="font-size: 12px; margin-right: 5%">
                    <a
                      href="https://www.hospitalmaria.org/"
                      target="_blank"
                      style="text-decoration: none; color: #000"
                      >https://www.hospitalmaria.org/
                    </a>

                    <span id="iconos_RRSS">
                      <label for="" style="font-size: 12px;">¡Síguenos!  </label>
                      <a
                        href="https://www.facebook.com/hospitalmariaep"
                        target="_blank"
                      >
                        <img
                          id="Icono_Facebook"
                          src="icons\facebook.png"
                          style="width: 03%; height: 03%; max-width: 10px !important; max-height: 10px !important;"
                          alt="Facebook"
                        />
                      </a>
                      <a
                        href="https://www.instagram.com/hospital_maria/"
                        target="_blank"
                      >
                        <img
                          id="Icono_IG"
                          src="icons\IG.png"
                          style="width: 03%; height: 03%; max-width: 10px !important; max-height: 10px !important;"
                          alt="Instagram"
                        />
                      </a>
                      <a
                        href="https://x.com/Hospital_Maria"
                        target="_blank"
                      >
                        <img
                          id="Icono_Twitter"
                          src="icons\x.png"
                          style="width: 03%; height: 03%; max-width: 10px !important; max-height: 10px !important;"
                          alt="x.com"
                        />
                      </a>
                      <a
                        href="https://www.youtube.com/channel/UCP6IG7QpdkD5eFk96pk_FoA?view_as=subscriber"
                        target="_blank"
                      >
                        <img
                          id="Icono_YouTube"
                          src="icons\Youtube.png"
                          style="width: 03%; height: 03%; max-width: 10px !important; max-height: 10px !important;"
                          alt="Youtube"
                        />
                      </a>
                      <a
                        href="https://www.linkedin.com/company/fundaci%C3%B3n-amigos-del-hospital-mar%C3%ADa/mycompany/"
                        target="_blank"
                      >
                        <img
                          id="Icono_LinkedIn"
                          src="icons\iconoLinkedIn.png"
                          style="width: 03%; height: 03%; max-width: 10px !important; max-height: 10px !important;"
                          alt="LinkedIn"
                        />
                      </a> 
                      </span>
                    </span>
                </div>
              </td>
            </tr>
          </tfoot>
        </table>
        <br />
      </div>
      <button id="Copiar" onclick="ejecutar('tablafirma')">Copiar firma</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
